{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apun AI Assistant</title>
    <link rel="stylesheet" href="{% static 'chatbot/style.css' %}">
</head>
<body>

<div class="chat-container">

```
<div class="chat-header">
    🤖 Apun AI Assistant
    <span>Online</span>
</div>

<div id="chat-box" class="chat-box">

    <div class="message bot-message">
        <strong>Assistant</strong><br>
        Hello 👋 I'm your AI Assistant.
        Ask me anything.
    </div>

</div>

<div class="input-area">

    <input type="text"
           id="message"
           placeholder="Ask anything...">

    <button onclick="sendMessage()">➤</button>

</div>
```

</div>

<script>

function getCookie(name){
    let cookieValue=null;
    if(document.cookie!==""){
        const cookies=document.cookie.split(";");
        for(let cookie of cookies){
            cookie=cookie.trim();
            if(cookie.startsWith(name+"=")){
                cookieValue=decodeURIComponent(cookie.substring(name.length+1));
                break;
            }
        }
    }
    return cookieValue;
}

const csrftoken=getCookie("csrftoken");

async function sendMessage(){

    const input=document.getElementById("message");
    const msg=input.value.trim();

    if(!msg) return;

    const chat=document.getElementById("chat-box");

    chat.innerHTML+=`<div class="message user-message"><strong>You</strong><br>${msg}</div>`;

    input.value="";
    chat.scrollTop=chat.scrollHeight;

    const typingId="typing"+Date.now();

    chat.innerHTML+=`<div class="message bot-message" id="${typingId}"><strong>Assistant</strong><br><span class="typing">Thinking...</span></div>`;

    chat.scrollTop=chat.scrollHeight;

    try{

        const response=await fetch("/chat/",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "X-CSRFToken":csrftoken
            },
            body:JSON.stringify({message:msg})
        });

        const data=await response.json();

        document.getElementById(typingId).innerHTML=`<strong>Assistant</strong><br>${data.reply.replace(/\n/g,"<br>")}`;

        chat.scrollTop=chat.scrollHeight;

    }
    catch(err){
        document.getElementById(typingId).innerHTML=`<strong>Assistant</strong><br>⚠️ Sorry! Something went wrong.`;
    }
}

document.getElementById("message").addEventListener("keydown",function(e){
    if(e.key==="Enter") sendMessage();
});

</script>

</body>
</html>
